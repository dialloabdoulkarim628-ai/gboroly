name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    # PostgreSQL éphémère pour les tests d'intégration (RUN_DB_TESTS=1).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gboroly
          POSTGRES_PASSWORD: gboroly
          POSTGRES_DB: gboroly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gboroly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://gboroly:gboroly@localhost:5432/gboroly?schema=public
      DIRECT_URL: postgresql://gboroly:gboroly@localhost:5432/gboroly?schema=public
      # Secrets factices : suffisent aux tests (l'auth d'intégration n'utilise pas de vraies clés).
      JWT_SECRET: ci-test-secret
      JWT_ACCESS_TTL: '900'
      JWT_REFRESH_TTL: '2592000'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11.24 requiert Node >= 22.13 (utilise node:sqlite).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gboroly/database exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations to test database
        run: pnpm --filter @gboroly/database exec prisma migrate deploy

      - name: Seed database (roles, permissions, sport)
        run: pnpm --filter @gboroly/database seed

      - name: Test (unit + integration)
        env:
          RUN_DB_TESTS: '1'
        run: pnpm test

      - name: Build
        run: pnpm build
